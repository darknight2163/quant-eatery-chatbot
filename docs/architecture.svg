<svg width="680" height="615" viewBox="0 0 680 615" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Quicky chatbot architecture</title>
<desc>Five-layer pipeline: website frontend, Dialogflow ES agent, ngrok tunnel, FastAPI backend, and SQLite database.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="615" fill="#FFFFFF"/>

<!-- Title -->
<text x="340" y="32" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="bold" fill="#2C2C2A">Quicky — Food Ordering Chatbot Architecture</text>

<!-- Box 1: Website frontend -->
<rect x="180" y="56" width="320" height="58" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.3"/>
<text x="340" y="76" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A1B0C">Website frontend</text>
<text x="340" y="95" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="11.5" fill="#993C1D">HTML · CSS · JavaScript + embedded chat widget</text>

<line x1="305" y1="114" x2="305" y2="162" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="295" y="132" text-anchor="end" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#5F5E5A">user message</text>
<line x1="375" y1="162" x2="375" y2="114" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="385" y="150" text-anchor="start" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#888780">bot reply text</text>

<!-- Box 2: Dialogflow ES agent -->
<rect x="180" y="162" width="320" height="58" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text x="340" y="182" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="bold" fill="#26215C">Dialogflow ES agent</text>
<text x="340" y="201" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="11.5" fill="#3C3489">NLU · intents, entities &amp; contexts</text>

<line x1="305" y1="220" x2="305" y2="268" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="295" y="238" text-anchor="end" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#5F5E5A">webhook POST</text>
<line x1="375" y1="268" x2="375" y2="220" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="385" y="256" text-anchor="start" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#888780">JSON response</text>

<!-- Box 3: ngrok tunnel -->
<rect x="180" y="268" width="320" height="58" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
<text x="340" y="288" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">ngrok tunnel</text>
<text x="340" y="307" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="11.5" fill="#444441">HTTPS webhook relay (local dev)</text>

<line x1="305" y1="326" x2="305" y2="374" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="295" y="344" text-anchor="end" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#5F5E5A">forwarded request</text>
<line x1="375" y1="374" x2="375" y2="326" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="385" y="362" text-anchor="start" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#888780">HTTP response</text>

<!-- Box 4: FastAPI backend -->
<rect x="180" y="374" width="320" height="58" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
<text x="340" y="394" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="bold" fill="#04342C">FastAPI backend</text>
<text x="340" y="413" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="11.5" fill="#0F6E56">Python · Uvicorn · pyngrok · intent router</text>

<line x1="305" y1="432" x2="305" y2="480" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="295" y="450" text-anchor="end" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#5F5E5A">SQL query</text>
<line x1="375" y1="480" x2="375" y2="432" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="385" y="468" text-anchor="start" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#888780">query result</text>

<!-- Box 5: SQLite database -->
<rect x="180" y="480" width="320" height="58" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.3"/>
<text x="340" y="500" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="bold" fill="#412402"> SQLite database</text>
<text x="340" y="519" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="11.5" fill="#854F0B">food_items · orders · order_tracking</text>

<!-- Side annotation: session state -->
<rect x="500" y="374" width="150" height="58" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="575" y="396" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="11" font-weight="bold" fill="#4B1528">In-progress orders</text>
<text x="575" y="412" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#72243E">in-memory dict</text>
<text x="575" y="426" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#72243E">keyed by session ID</text>
<line x1="500" y1="403" x2="460" y2="403" stroke="#993556" stroke-width="1" stroke-dasharray="3 3"/>

<!-- Legend -->
<line x1="180" y1="558" x2="205" y2="558" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="212" y="562" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#444441">Request</text>
<line x1="280" y1="558" x2="305" y2="558" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="312" y="562" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#444441">Response</text>

<rect x="180" y="580" width="14" height="14" rx="3" fill="#FAECE7" stroke="#D85A30"/>
<text x="200" y="591" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#444441">Client</text>
<rect x="260" y="580" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
<text x="280" y="591" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#444441">NLU</text>
<rect x="330" y="580" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="350" y="591" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#444441">Infra</text>
<rect x="405" y="580" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="425" y="591" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#444441">Backend</text>
<rect x="490" y="580" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/>
<text x="510" y="591" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#444441">Data</text>

</svg>
